name: Lint

# Runs on every pull request into main. The "luacheck" job is a required status check
# (repo ruleset "Require lint"), so a PR can't be merged until it passes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run luacheck
        uses: lunarmodules/luacheck@v1
